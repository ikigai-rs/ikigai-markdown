[package]
name = "ikigai-markdown"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Markdown as a graph for ikigai: urn:markdown:lift — one generic structural lift (frontmatter, sections, lists, links, code) plus a mapping resource (a lift profile and SPARQL CONSTRUCTs) that turns the structure into a domain model. The lifter knows no document vocabulary; the mapping carries all of it."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-markdown"
homepage = "https://github.com/ikigai-rs/ikigai-markdown"
readme = "README.md"
keywords = ["ikigai", "roc", "markdown", "rdf", "module"]
categories = ["parser-implementations", "text-processing"]

[features]
# ⚠ A TEST GATE, never a `cfg` on a code path. `oxigraph/http-client` is what `ikigai-cli` gets
# by unification (rudof_rdf enables `http-client-rustls-native` on every native target, through
# `ikigai-shacl`), and with it on, every `SparqlEvaluator` installs a default HTTP service
# handler: a `SERVICE <http://…>` in a mapping's `md:construct` would be an outbound request no
# `urn:cap:net:*` gates (ledger #1085, #1083). `src/sparql.rs` refuses it in every build; this
# line is how CI (`features: http-client`) builds the crate the way those hosts do and proves
# it, with `tests/service_egress.rs` against a 127.0.0.1 stub. Only that test's CONTROL is
# cfg'd on it. Plain `http-client`, not a TLS variant: the stub is plain HTTP.
http-client = ["oxigraph/http-client"]

[dependencies]
# The released kernel. 0.1.70 is the version this crate was built and tested
# against; a lower floor has NOT been measured. The API used is old (ArgSpec
# `class`/`one_of`/`default_value`, `Invocation::source`, `depends_on`), so the
# real floor is probably far lower — measure before loosening this.
ikigai-core = "0.1.70"
async-trait = "0.1"
# CommonMark with GFM tables, task lists and YAML-style metadata blocks. Default
# features off: the `html` renderer is not used (md->html is out of scope).
pulldown-cmark = { version = "0.13.4", default-features = false }
# Frontmatter. The EVENT parser, not the loader: the loader resolves `0002` to the
# integer 2 and `settled` to a string by YAML's rules, and a generic lift must keep
# the text the author wrote — typing is the mapping's job. `encoding` off: input
# is already a Rust string.
yaml-rust2 = { version = "0.10.4", default-features = false }
# The lift profile's citation patterns and split delimiters are regexes supplied as
# data by the mapping resource.
regex = "1.12"
# Stage 2: the mapping's CONSTRUCTs run over the structural graph in an in-memory
# store; the mapping itself is Turtle. No rocksdb (default features off), so this
# stays pure Rust — the same posture as ikigai-linkeddata.
oxigraph = { version = "0.5.11", default-features = false }
# The bounds on caller SPARQL — a mapping's `md:construct` is caller text (ledger #963):
# `limits::check_sparql` + `limits::on_sparql_stack` keep a nested or chained query from
# overflowing the stack and aborting the host, and `budget::check_query` keeps the planner,
# which cannot be interrupted, from spending minutes on one. Taken from the store rather
# than copied, so there is one set of constants (ledger #976 is where they get a shared
# home). Default features off: no RocksDB, and it builds for wasm. What it adds to this
# crate's graph is the `toml` stack, `serde_json` and `indexmap`, all pure Rust.
# 0.2.10 is the TRUE floor: `limits` arrived in 0.2.7, `budget::check_query` in 0.2.8, and
# `service` (the refusing evaluator and the `SERVICE` door check, ledger #1085) in 0.2.10.
# ⚠ `"0.2.10"` is a CEILING as well as a floor — `<0.3.0`.
ikigai-store = { version = "0.2.10", default-features = false }
# The parser oxigraph itself uses, named so a construct's ALGEBRA can be measured by
# `budget::check_query` before oxigraph plans it. Already in the graph through oxigraph,
# which pins `=0.4.7` and converts from this type (`for_query`); the caret unifies with it.
spargebra = "0.4.7"

# oxigraph pulls getrandom 0.3, whose wasm backend has to be selected explicitly —
# the pairing ikigai-sparql uses.
[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { version = "0.5.11", default-features = false, features = ["js"] }

[dev-dependencies]
futures = "0.3"
# `tests/tree_guard.rs` holds the tokens it forbids as SHA-256 hashes, so that the
# guard can scan itself and pass.
sha2 = "0.10"
# The module recipe as one test (`tests/conformance.rs`). 0.6.0 for SPACE-NAME (ledger
# #987), the newest published. ⚠ A CEILING as well as a floor: `<0.7.0`.
# Its own floor, `ikigai-core = "0.1.89"`, pulls a new enough kernel into every TEST
# build, so `[dependencies] ikigai-core` above stays at what the LIBRARY needs: the
# library names no space and uses nothing from 0.1.89.
ikigai-conformance = "0.6.0"
# The REPL engine, for `tests/pipeline.rs`: whether `source urn:file:x.md |
# urn:markdown:lift` routes is decided by the engine, which a kernel-level test
# cannot see. 0.1.43: 0.1.23 pulls an `ikigai-resolve` that predates core's `Resolved`
# change, and conformance 0.6.0 brings core 0.1.89 into the test build.
ikigai-engine = "0.1.43"
# The engine reads each contract as `Meta as=application/json`; without a renderer
# it fails open and the pipeline tests prove nothing.
serde_json = "1"
