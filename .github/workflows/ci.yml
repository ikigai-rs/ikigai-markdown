name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # `features: http-client` is a GATE (ledger #1085): it turns on `oxigraph/http-client`, which
    # `ikigai-cli` gets from rudof by unification, so `tests/service_egress.rs` runs against a
    # local stub in the build where a mapping's `SERVICE` WOULD reach the network, and proves it
    # does not. The default `test` job runs the same file without it.
    with:
      wasm-lib: true
      features: http-client
